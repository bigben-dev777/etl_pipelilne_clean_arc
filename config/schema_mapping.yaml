# Schema mapping configuration for known data sources
# Maps source column names to target schema columns

sources:
  # Default fallback mapping using fuzzy matching
  default:
    fuzzy_match:
      enabled: true
      similarity_threshold: 0.85
    # Common column name patterns
    patterns:
      company:
        - "name"
        - "organization"
      phone:
        - "phone"
      email:
        - "e-mail"
        - "mail"
      address1:
        - "address"
      city:
        - "town"
        - "municipality"
      state:
        - "province"
        - "st"
      zip:
        - "postal"
        - "zipcode"
        - "postcode"
      capacity:
        - "cap"
        - "max"
        - "total"
        - "size"
      license_number:
        - "license"
        - "credential"
        - "permit"
        - "certification"
      license_status:
        - "status"
